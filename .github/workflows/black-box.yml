# CI dei test esterni black-box: costruisce l'immagine standalone del motore dal ref
# indicato (default: main) e ci lancia contro la suite Playwright su browser reale.
# Ogni run verde certifica la coppia «motore @ ref × questa suite @ commit corrente».
name: black-box

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      engine-ref:
        description: "Ref di mockxy da testare (branch, tag o SHA)"
        required: false
        default: "main"

jobs:
  black-box:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # I due repo affiancati: il compose costruisce da ../mockxy.
      - name: Checkout della suite
        uses: actions/checkout@v4
        with:
          path: mockxy-acceptance-tests

      - name: Checkout del motore
        uses: actions/checkout@v4
        with:
          repository: tosdan/mockxy
          ref: ${{ inputs.engine-ref || 'main' }}
          # Se il repo del motore è privato serve un fine-grained PAT (contents: read)
          # salvato come secret ENGINE_REPO_TOKEN; se è pubblico basta il token di default.
          token: ${{ secrets.ENGINE_REPO_TOKEN || github.token }}
          path: mockxy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mockxy-acceptance-tests/package-lock.json

      # I browser Playwright pesano ~350-400 MB: cache con chiave sul lockfile (che pinna
      # la versione di Playwright). Su cache hit restano solo le dipendenze di sistema.
      - name: Cache dei browser Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('mockxy-acceptance-tests/package-lock.json') }}

      - name: Installa la suite
        working-directory: mockxy-acceptance-tests
        run: npm ci

      - name: Installa i browser Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: mockxy-acceptance-tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Dipendenze di sistema dei browser (cache già calda)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: mockxy-acceptance-tests
        run: npx playwright install-deps chromium firefox webkit

      # L'attesa vive negli healthcheck del compose, accanto alla topologia: una nuova
      # istanza aggiunta allo stack porta con sé il proprio criterio di prontezza.
      - name: Avvia lo stack e attendi che sia sano
        working-directory: mockxy-acceptance-tests
        run: docker compose up -d --build --wait --wait-timeout 90

      - name: Esegui i test
        working-directory: mockxy-acceptance-tests
        run: npm test

      - name: Log dei container (solo su fallimento)
        if: failure()
        working-directory: mockxy-acceptance-tests
        run: docker compose logs --no-color

      - name: Report Playwright (solo su fallimento)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mockxy-acceptance-tests/test-results/
          if-no-files-found: ignore

      - name: Spegni lo stack
        if: always()
        working-directory: mockxy-acceptance-tests
        run: docker compose down
